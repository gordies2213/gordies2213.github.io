name: Deploy CLOUDED Current

on:
  push:
    branches: [main]
    paths:
      - "clouded/**"
      - ".github/workflows/deploy-clouded.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: clouded-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate current CLOUDED build
        shell: bash
        run: |
          test -f clouded/index.html
          test -f clouded/manifest.json
          test -f clouded/service-worker.js
          grep -q 'id="importer"' clouded/index.html
          grep -q 'cloudBackgroundReconcile' clouded/index.html
          grep -q 'SUPABASE_URL' clouded/index.html
          echo "CLOUDED current build validation passed."

      - name: Prepare GitHub Pages site
        shell: bash
        run: |
          rm -rf _site
          mkdir -p _site
          cp clouded/index.html _site/index.html
          cp clouded/manifest.json _site/manifest.json
          cp clouded/service-worker.js _site/service-worker.js
          touch _site/.nojekyll
          echo "Prepared current CLOUDED build for deployment."

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy current CLOUDED to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
