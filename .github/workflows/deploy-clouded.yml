name: Deploy CLOUDED v7.9.0 STABLE

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Rebuild exact CLOUDED v7.9.0 STABLE release
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          import gzip
          import hashlib

          parts = sorted(Path(".release").glob("v790.part*"))
          if len(parts) != 4:
              raise SystemExit(f"Expected 4 release chunks, found {len(parts)}")

          encoded = "".join(p.read_text(encoding="utf-8").strip() for p in parts)

          # The stored release is intentionally unpadded base64.
          encoded += "=" * (-len(encoded) % 4)

          payload = base64.b64decode(encoded, validate=True)
          html = gzip.decompress(payload)

          if b"7.9.0-stable" not in html:
              raise SystemExit("Release stamp 7.9.0-stable was not found; refusing to deploy.")

          out = Path("_site")
          out.mkdir(exist_ok=True)
          (out / "index.html").write_bytes(html)
          (out / ".nojekyll").write_text("", encoding="utf-8")

          print(f"Rebuilt index.html: {len(html)} bytes")
          print("SHA256:", hashlib.sha256(html).hexdigest())
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
